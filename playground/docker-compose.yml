# Explicit project name so this playground never collides with another repo's
# "playground" directory (Compose derives the project name from the folder).
name: idempotency-playground

networks:
  playground-net:
    external: false

services:
  playground-redis:
    image: redis:8-alpine
    restart: on-failure
    networks:
      - playground-net
    ports:
      - "6379:6379/tcp"

  # Upstream echo service: returns JSON with a fresh random id per request, so a
  # cached (replayed) response is easy to spot — its id stays the same.
  playground-service:
    image: node:24-alpine
    entrypoint: [ "node", "/app/service.js" ]
    environment:
      PORT: 3200
    volumes:
      - ./app:/app:ro
    networks:
      - playground-net

  # Kong in DB-less mode: the whole setup comes from kong.yml. The plugin source
  # is mounted in directly, so there is no custom image to build.
  playground-kong:
    image: kong:3.9.2
    depends_on:
      - playground-redis
      - playground-service
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PLUGINS: bundled,idempotency
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: '0.0.0.0:8001'
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ../kong/plugins/idempotency:/usr/local/share/lua/5.1/kong/plugins/idempotency:ro
      - ./kong.yml:/kong/kong.yml:ro
    restart: on-failure
    networks:
      - playground-net
    ports:
      - "8000:8000/tcp"          # proxy
      - "127.0.0.1:8001:8001/tcp" # admin (read-only in DB-less)
