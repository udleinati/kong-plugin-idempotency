# Kong declarative (DB-less) configuration for the idempotency playground.
#
# This file IS the playground's Kong setup: one upstream echo service exposed
# through two routes — one where the idempotency key is optional and one where
# it is required. Edit it and `docker compose restart playground-kong` to try
# different settings.
_format_version: "3.0"

services:
  - name: echo-service
    url: http://playground-service:3200
    routes:
      # Idempotency key optional: POSTs without X-Idempotency-Key pass through.
      - name: optional-route
        paths:
          - /
        plugins:
          - name: idempotency
            config:
              is_required: false
              redis_cache_time: 7200
              redis:
                host: playground-redis
                port: 6379

      # Idempotency key required: POSTs without X-Idempotency-Key get 400.
      # More specific than "/", so requests to /required match this route.
      - name: required-route
        paths:
          - /required
        plugins:
          - name: idempotency
            config:
              is_required: true
              redis_cache_time: 7200
              redis:
                host: playground-redis
                port: 6379

      # Short TTL, used by edge.sh to exercise cache expiry.
      - name: shortttl-route
        paths:
          - /shortttl
        plugins:
          - name: idempotency
            config:
              is_required: false
              redis_cache_time: 2
              redis:
                host: playground-redis
                port: 6379

      # Idempotency on more than POST.
      - name: multi-route
        paths:
          - /multi
        plugins:
          - name: idempotency
            config:
              methods: ["POST", "PUT", "PATCH", "DELETE"]
              redis_cache_time: 7200
              redis:
                host: playground-redis
                port: 6379

      # Strict mode: reject with 503 when Redis is unavailable.
      - name: strict-route
        paths:
          - /strict
        plugins:
          - name: idempotency
            config:
              fail_open: false
              redis_cache_time: 7200
              redis:
                host: playground-redis
                port: 6379

      # Authenticated route (key-auth): idempotency keys are scoped per consumer,
      # so the SAME X-Idempotency-Key used by different consumers must not
      # collide. Send the credential as `apikey: <key>` (see consumers below).
      - name: auth-route
        paths:
          - /auth
        plugins:
          - name: key-auth
            config:
              key_names: ["apikey"]
          - name: idempotency
            config:
              redis_cache_time: 7200
              redis:
                host: playground-redis
                port: 6379

      # cache_5xx=true: a 5xx response IS cached and replayed for the whole TTL.
      - name: cache5xx-route
        paths:
          - /cache5xx
        plugins:
          - name: idempotency
            config:
              cache_5xx: true
              redis_cache_time: 7200
              redis:
                host: playground-redis
                port: 6379

      # verify_fingerprint=false: a reused key replays the original response even
      # when the body differs (no 422 on mismatch).
      - name: nofp-route
        paths:
          - /nofp
        plugins:
          - name: idempotency
            config:
              verify_fingerprint: false
              redis_cache_time: 7200
              redis:
                host: playground-redis
                port: 6379

      # Non-default Redis logical database: keys land in db 1, not db 0.
      - name: db-route
        paths:
          - /db
        plugins:
          - name: idempotency
            config:
              redis_cache_time: 7200
              redis:
                host: playground-redis
                port: 6379
                database: 1

      # Password-protected Redis (AUTH): backed by the playground-redis-auth
      # service (started with --requirepass). Exercises the auth() path.
      - name: redis-auth-route
        paths:
          - /redis-auth
        plugins:
          - name: idempotency
            config:
              redis_cache_time: 7200
              redis:
                host: playground-redis-auth
                port: 6379
                password: playpass

# Consumers for the per-consumer scoping probe (/auth route, key-auth).
consumers:
  - username: alice
    keyauth_credentials:
      - key: alice-key
  - username: bob
    keyauth_credentials:
      - key: bob-key
